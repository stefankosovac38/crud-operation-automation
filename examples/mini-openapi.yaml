openapi: 3.0.3
info:
  title: Mini Pet API
  version: "1.0.0"
tags:
  - name: pet
    description: Pets
paths:
  /pets:
    get:
      tags: [pet]
      operationId: listPets
      summary: List pets
      responses:
        "200":
          description: OK
    post:
      tags: [pet]
      operationId: createPet
      summary: Create pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
  /pets/{id}:
    get:
      tags: [pet]
      operationId: getPet
      summary: Get pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      tags: [pet]
      operationId: deletePet
      summary: Delete pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content
